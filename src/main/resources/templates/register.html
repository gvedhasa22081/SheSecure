<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | SheSecure</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth"><form class="auth-card" th:action="@{/register}" method="post"><div class="brand-mark">S</div><p class="eyebrow">SHESECURE</p><h1>Create your account</h1><p class="muted">Your personal space for digital safety.</p><div class="notice error" th:if="${error}" th:text="${error}"></div><label>Full name<input name="fullName" required maxlength="100"></label><label>Email address<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required><small>Use at least 8 characters.</small></label><button class="btn primary wide">Create account</button><p class="muted center">Already registered? <a th:href="@{/login}">Sign in</a></p></form></body></html>

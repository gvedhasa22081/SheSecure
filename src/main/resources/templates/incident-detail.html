<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Incident details | SheSecure</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="form-page"><a th:href="@{/dashboard}" class="back">← Back to dashboard</a><div class="form-card"><p class="eyebrow">SAVED INCIDENT</p><h1 th:text="${incident.title}">Incident title</h1><div class="detail-meta"><span th:text="${incident.category}"></span><span th:text="${incident.platform}"></span><span th:text="${incident.incidentDate}"></span></div><h3>Description</h3><p class="description" th:text="${incident.description}">Description</p><div class="panel-head"><h3>Encrypted evidence vault</h3></div><div th:if="${#lists.isEmpty(evidence)}" class="empty compact">No evidence files attached.</div><div class="file-row" th:each="file : ${evidence}"><span>▣</span><div class="grow"><strong th:text="${file.originalName}">file.png</strong><small class="muted" th:text="${file.uploadedAt}"></small></div><a class="text-link" th:href="@{'/evidence/' + ${file.id}}">Download</a></div><form th:action="@{'/incidents/' + ${incident.id} + '/delete'}" method="post" onsubmit="return confirm('Permanently delete this incident and its evidence?')"><button class="btn danger">Delete incident and evidence</button></form></div></main></body></html>

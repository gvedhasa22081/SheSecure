<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | SheSecure</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth"><form class="auth-card" th:action="@{/login}" method="post"><div class="brand-mark">S</div><p class="eyebrow">YOUR DIGITAL SAFETY SPACE</p><h1>Welcome back</h1><p class="muted">Sign in to manage your privacy and incident records.</p><div class="notice" th:if="${param.registered}">Account created. You can now sign in.</div><div class="notice error" th:if="${param.error}">Invalid email or password.</div><label>Email address<input name="username" type="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" required placeholder="Your password"></label><button class="btn primary wide">Sign in</button><p class="muted center">New to SheSecure? <a th:href="@{/register}">Create an account</a></p></form></body></html>
